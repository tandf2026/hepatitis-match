media:
  input: "images"
  output: "/images"

content:
  - name: projects
    label: 项目管理
    type: file
    path: projects.json
    list: true
    fields:
      - name: id
        label: 项目ID
        type: string
        required: true
      - name: name
        label: 项目名称
        type: string
        required: true
      - name: status
        label: 状态
        type: select
        options:
          values:
            - active
            - suspended
            - ended
        default: active
        required: true
      - name: qrCodeUrl
        label: 研究者微信号
        type: string
        required: true
      - name: includeRules
        label: 入选标准 (必须是数组)
        type: text
        required: true
      - name: excludeRules
        label: 排除标准 (必须是数组)
        type: text
        required: false
