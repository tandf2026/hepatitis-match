media:
  input: "images"
  output: "/images"

content:
  - name: projects
    label: 项目管理
    type: file
    path: projects.json
    list: true
    fields:
      - name: id
        label: 项目ID
        type: string
        required: true
      - name: name
        label: 项目名称
        type: string
        required: true
      - name: status
        label: 状态
        type: select
        options:
          values:
            - active
            - suspended
            - ended
        default: active
        required: true
      - name: qrCodeUrl
        label: 研究者二维码
        type: image
        required: true
      - name: rules
        label: 入排规则（JSON）
        type: code
        required: false
